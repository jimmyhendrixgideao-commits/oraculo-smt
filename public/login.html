<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ORÁCULO SMT — Login</title>
  <style>
    * { box-sizing:border-box; margin:0; padding:0; }
    body {
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
      background:linear-gradient(135deg,#04342C 0%,#085041 50%,#0F6E56 100%);
      min-height:100vh; display:flex; align-items:center; justify-content:center;
    }
    .card {
      background:#fff; border-radius:16px; padding:40px 36px;
      width:100%; max-width:380px; box-shadow:0 20px 60px rgba(0,0,0,0.3);
    }
    .logo { text-align:center; margin-bottom:28px; }
    .logo svg { width:56px; height:56px; }
    .logo h1 { font-size:22px; font-weight:800; color:#085041; margin-top:10px; }
    .logo p  { font-size:12px; color:#555; font-weight:500; margin-top:3px; }

    label { display:block; font-size:12px; font-weight:700; color:#111; margin-bottom:5px; }
    input {
      width:100%; border:1.5px solid #D0D0C8; border-radius:8px;
      padding:11px 14px; font-size:14px; font-weight:500; color:#111;
      outline:none; transition:border-color 0.2s;
      background:#FAFAFA;
    }
    input:focus { border-color:#1D9E75; box-shadow:0 0 0 3px rgba(29,158,117,0.12); }
    .field { margin-bottom:16px; }

    .btn-login {
      width:100%; padding:13px; background:#085041; color:#fff;
      border:none; border-radius:8px; font-size:15px; font-weight:700;
      cursor:pointer; margin-top:8px; transition:background 0.2s;
      letter-spacing:0.02em;
    }
    .btn-login:hover  { background:#0F6E56; }
    .btn-login:active { background:#04342C; }
    .btn-login:disabled { background:#aaa; cursor:not-allowed; }

    .error {
      background:#FEE2E2; border:1px solid #FECACA; border-radius:8px;
      padding:10px 14px; font-size:12px; font-weight:600; color:#991B1B;
      margin-bottom:14px; display:none;
    }
    .footer {
      text-align:center; margin-top:20px;
      font-size:11px; color:#888; font-weight:500;
    }
    .attempts { font-size:11px; color:#888; text-align:center; margin-top:8px; }
    .spinner { display:none; width:18px; height:18px; border:2.5px solid rgba(255,255,255,0.3); border-top-color:#fff; border-radius:50%; animation:spin 0.7s linear infinite; margin:0 auto; }
    @keyframes spin { to { transform:rotate(360deg); } }
  </style>
</head>
<body>
<div class="card">
  <div class="logo">
    <svg viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="28" cy="28" r="28" fill="#085041"/>
      <line x1="28" y1="5" x2="28" y2="11" stroke="white" stroke-width="2" stroke-linecap="round"/>
      <circle cx="28" cy="5" r="2.5" fill="white"/>
      <rect x="12" y="11" width="32" height="22" rx="7" fill="white"/>
      <rect x="16" y="15" width="24" height="10" rx="3" fill="#0F6E56"/>
      <circle cx="22" cy="20" r="4" fill="#085041"/>
      <circle cx="22" cy="20" r="2" fill="white"/>
      <circle cx="34" cy="20" r="4" fill="#085041"/>
      <circle cx="34" cy="20" r="2" fill="white"/>
      <path d="M20 28 Q28 32 36 28" stroke="#085041" stroke-width="2" stroke-linecap="round" fill="none"/>
      <rect x="16" y="34" width="24" height="14" rx="5" fill="white" opacity="0.9"/>
      <circle cx="22" cy="41" r="2" fill="#1D9E75"/>
      <circle cx="28" cy="41" r="2" fill="#085041"/>
      <circle cx="34" cy="41" r="2" fill="#1D9E75"/>
    </svg>
    <h1>Oráculo SMT</h1>
    <p>Sistema Inteligente de Suporte Técnico</p>
  </div>

  <div class="error" id="errorMsg"></div>

  <div class="field">
    <label for="username">Usuário</label>
    <input type="text" id="username" placeholder="Digite seu usuário" autocomplete="username" autofocus/>
  </div>
  <div class="field">
    <label for="password">Senha</label>
    <input type="password" id="password" placeholder="Digite sua senha" autocomplete="current-password"/>
  </div>

  <button class="btn-login" id="btnLogin" onclick="doLogin()">
    <span id="btnText">Entrar</span>
    <div class="spinner" id="spinner"></div>
  </button>

  <div class="attempts" id="attemptsMsg"></div>
  <div class="footer">
    By Jimmy Hendrix Queiroz · ORÁCULO SMT v2.0
  </div>
</div>

<script>
  // Só redireciona se tiver token válido — sem loops
  const _t = localStorage.getItem('oraculoToken');
  if (_t) {
    fetch('/api/auth/verify', { headers: { 'Authorization': `Bearer ${_t}` } })
      .then(r => r.ok ? r.json() : { valid: false })
      .then(d => { if (d.valid) window.location.href = '/'; })
      .catch(() => {}); // ignora erros silenciosamente
  }

  // Enter para logar
  document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

  let attempts = 0;

  async function doLogin() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const errorEl  = document.getElementById('errorMsg');
    const btn      = document.getElementById('btnLogin');
    const spinner  = document.getElementById('spinner');
    const btnText  = document.getElementById('btnText');
    const attEl    = document.getElementById('attemptsMsg');

    errorEl.style.display = 'none';

    if (!username || !password) {
      showError('Preencha usuário e senha.');
      return;
    }

    btn.disabled          = true;
    spinner.style.display = 'block';
    btnText.style.display = 'none';
    attEl.textContent     = 'Verificando...';

    try {
      const r = await fetch('/api/auth/login', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ username, password })
      });

      let data = {};
      try { data = await r.json(); } catch(e) { throw new Error('Resposta inválida do servidor.'); }

      if (!r.ok) {
        attempts++;
        showError(data.error || `Erro ${r.status}: tente novamente.`);
        attEl.textContent = attempts >= 3 ? `⚠️ ${5 - attempts} tentativas restantes.` : '';
      } else {
        attEl.textContent = '✅ Login OK! Redirecionando...';
        localStorage.setItem('oraculoToken',    data.token);
        localStorage.setItem('oraculoUsername', data.username);
        localStorage.setItem('oraculoRole',     data.role);
        setTimeout(() => { window.location.href = '/'; }, 500);
      }
    } catch(e) {
      showError('Erro de conexão: ' + e.message);
    } finally {
      btn.disabled          = false;
      spinner.style.display = 'none';
      btnText.style.display = 'block';
    }
  }

  function showError(msg) {
    const el = document.getElementById('errorMsg');
    el.textContent   = '⚠️ ' + msg;
    el.style.display = 'block';
    document.getElementById('password').value = '';
    document.getElementById('password').focus();
  }
</script>
</body>
</html>
